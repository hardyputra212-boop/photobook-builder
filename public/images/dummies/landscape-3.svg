<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0c3fc"/>
      <stop offset="100%" style="stop-color:#8ec5fc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#l3)"/>
  <!-- City buildings -->
  <rect x="50" y="200" width="80" height="200" fill="rgba(100,100,150,0.5)"/>
  <rect x="150" y="150" width="100" height="250" fill="rgba(80,80,120,0.5)"/>
  <rect x="270" y="180" width="60" height="220" fill="rgba(100,100,150,0.5)"/>
  <rect x="350" y="120" width="90" height="280" fill="rgba(80,80,120,0.5)"/>
  <rect x="460" y="170" width="80" height="230" fill="rgba(100,100,150,0.5)"/>
  <!-- Windows -->
  <rect x="165" y="170" width="15" height="15" fill="rgba(255,255,200,0.8)"/>
  <rect x="200" y="170" width="15" height="15" fill="rgba(255,255,200,0.8)"/>
  <rect x="165" y="200" width="15" height="15" fill="rgba(255,255,200,0.8)"/>
  <rect x="200" y="200" width="15" height="15" fill="rgba(255,255,200,0.6)"/>
  <!-- Stars -->
  <circle cx="100" cy="50" r="2" fill="white" opacity="0.8"/>
  <circle cx="250" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="400" cy="60" r="2" fill="white" opacity="0.7"/>
  <circle cx="500" cy="40" r="1.5" fill="white" opacity="0.5"/>
  <text x="300" y="380" font-family="Arial" font-size="14" fill="white" text-anchor="middle" opacity="0.9">City Nightscape 🌃</text>
</svg>
