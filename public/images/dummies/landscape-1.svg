<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#l1)"/>
  <!-- Mountain shape -->
  <polygon points="0,400 200,150 400,400" fill="rgba(255,255,255,0.2)"/>
  <polygon points="150,400 350,100 600,400" fill="rgba(255,255,255,0.15)"/>
  <polygon points="300,400 500,180 700,400" fill="rgba(255,255,255,0.1)"/>
  <!-- Sun -->
  <circle cx="480" cy="100" r="50" fill="rgba(255,255,255,0.3)"/>
  <circle cx="480" cy="100" r="35" fill="rgba(255,255,255,0.5)"/>
  <text x="300" y="380" font-family="Arial" font-size="14" fill="white" text-anchor="middle" opacity="0.8">Landscape Photo - 6x4 inch</text>
</svg>
